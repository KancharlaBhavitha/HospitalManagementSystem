<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Medicine Payment</title>


<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 40px;
    }

    .container {
        width: 450px;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        text-align: center;
    }

    h2 {
        color: #333;
        margin-bottom: 25px;
    }

    .details {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 25px;
    }

    .row {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #ddd;
    }

    .label {
        font-weight: bold;
        color: #555;
    }

    .value {
        color: #333;
    }

    .amount {
        font-size: 24px;
        font-weight: bold;
        color: #673ab7;
        margin: 20px 0;
    }

    .pay-btn {
        width: 100%;
        padding: 13px;
        background: #673ab7;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    .pay-btn:hover {
        background: #512da8;
    }

    .back-btn {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background: #6c757d;
        color: white;
        text-decoration: none;
        border-radius: 6px;
    }
</style>


</head>

<body>

```
<div class="container">

    <h2>💊 Medicine Payment</h2>

    <div class="details">

        <div class="row">
            <span class="label">
                Appointment ID
            </span>

            <span class="value" id="appointmentId">
            </span>
        </div>

        <div class="row">
            <span class="label">
                Medicine Amount
            </span>

            <span class="value" id="medicineAmount">
            </span>
        </div>

    </div>

    <div class="amount" id="totalAmount">
        ₹0.00
    </div>

    <button class="pay-btn" onclick="makePayment()">
        Pay Medicine Bill
    </button>

    <a class="back-btn" href="javascript:history.back()">
        Back
    </a>

</div>

<script>

    const params = new URLSearchParams(window.location.search);

    const appointmentId = params.get("appointmentId");

    const amount = params.get("amount");

    document.getElementById("appointmentId").innerText =
        appointmentId || "N/A";

    const numericAmount = parseFloat(amount || "0");

    document.getElementById("medicineAmount").innerText =
        "₹" + numericAmount.toFixed(2);

    document.getElementById("totalAmount").innerText =
        "₹" + numericAmount.toFixed(2);

    function makePayment() {

        if (numericAmount <= 0) {
            alert("Invalid medicine amount.");
            return;
        }

        alert(
            "Medicine payment of ₹"
            + numericAmount.toFixed(2)
            + " successful!"
        );

        window.location.href =
            "medicine_invoice.jsp"
            + "?appointmentId="
            + appointmentId
            + "&amount="
            + numericAmount;
    }

</script>


</body>

</html>
