<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Hospital Management System - Login</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f2f6fa;
}

.container {
    width: 400px;
    margin: 80px auto;
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 12px #aaa;
}

h1 {
    text-align: center;
    color: darkblue;
    margin-bottom: 10px;
}

h2 {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 11px;
    box-sizing: border-box;
    border: 1px solid #aaa;
    border-radius: 6px;
}

input:focus,
select:focus {
    outline: none;
    border-color: darkblue;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 25px;
    background-color: green;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: darkgreen;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    display: block;
    margin: 10px;
    color: darkblue;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}

</style>

</head>

<body>

<div class="container">

    <h1>Hospital Management System</h1>

    <h2>Login</h2>


    <!-- IMPORTANT: LoginServlet URL -->

    <form
        action="/LoginServlet"
        method="post">


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required>


        <label for="role">
            Select Role
        </label>

        <select
            id="role"
            name="role"
            required>

            <option value="">
                Select Role
            </option>

            <option value="PATIENT">
                Patient
            </option>

            <option value="DOCTOR">
                Doctor
            </option>

            <option value="ADMIN">
                Admin
            </option>

        </select>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="links">

        <a href="/pages/patient_registration_page.html">
            New Patient? Create Patient Account
        </a>

        <a href="/pages/forgot_password.html">
            Forgot Password?
        </a>

    </div>

</div>

</body>

</html>
