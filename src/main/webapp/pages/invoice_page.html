<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Generate Invoice</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Hospital Invoice</h2>

        <p>
            Enter your Bill ID to view the invoice.
        </p>

        <form
            action="/HospitalManagementSystem/InvoiceServlet"
            method="get">

            <label>Bill ID</label>

            <input
                type="number"
                name="billNumber"
                required
                min="1"
                placeholder="Enter Bill ID">

            <button type="submit">
                View Invoice
            </button>

        </form>

    </div>

</body>

</html>
