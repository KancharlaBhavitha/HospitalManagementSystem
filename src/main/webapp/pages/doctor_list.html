<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Doctor List</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
}

.container{
width:90%;
margin:auto;
background:white;
padding:20px;
margin-top:30px;
}

table{
width:100%;
border-collapse:collapse;
}

table,th,td{
border:1px solid black;
}

th,td{
padding:10px;
text-align:center;
}

input{
padding:8px;
width:250px;
}

button{
padding:8px 15px;
}

</style>

</head>
<body>

<div class="container">

<h2 align="center">Doctor List</h2>

<form action="/DoctorListServlet" method="get">

<input type="text" name="search" placeholder="Search Doctor">

<button type="submit">Search</button>

</form>

<br>

<table>

<tr>

<th>Doctor Name</th>

<th>Specialization</th>

<th>Qualification</th>

<th>Experience</th>

<th>Fee</th>

<th>Available Timing</th>

<th>Action</th>

</tr>

<tr>

<td colspan="7">
Doctors will be displayed here
</td>

</tr>

</table>

</div>

</body>
</html>
