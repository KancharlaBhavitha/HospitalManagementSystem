<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>Patient Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 12px gray;
        }

        h2 {
            text-align: center;
            color: darkblue;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-size: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: darkblue;
            outline: none;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender label {
            display: inline;
            margin: 0;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: darkblue;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Patient Registration</h2>

    <form action="/HospitalManagementSystem/PatientServlet"
          method="post">


        <!-- Full Name -->

        <label>Full Name</label>

        <input type="text"
               name="fullName"
               placeholder="Enter Full Name"
               required>


        <!-- Email -->

        <label>Email</label>

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>


        <!-- Phone Number -->

        <label>Phone Number</label>

        <input type="tel"
               name="phoneNumber"
               placeholder="Enter Phone Number"
               required>


        <!-- Password -->

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Create Password"
               required>


        <!-- Confirm Password -->

        <label>Confirm Password</label>

        <input type="password"
               name="confirmPassword"
               placeholder="Confirm Password"
               required>


        <!-- Gender -->

        <label>Gender</label>

        <div class="gender">

            <label>
                <input type="radio"
                       name="gender"
                       value="Male"
                       required>
                Male
            </label>

            <label>
                <input type="radio"
                       name="gender"
                       value="Female">
                Female
            </label>

            <label>
                <input type="radio"
                       name="gender"
                       value="Other">
                Other
            </label>

        </div>


        <!-- Date of Birth -->

        <label>Date of Birth</label>

        <input type="date"
               name="dateOfBirth">


        <!-- Address -->

        <label>Address</label>

        <textarea name="address"
                  placeholder="Enter Address"></textarea>


        <!-- Submit -->

        <button type="submit">
            Create Account
        </button>

    </form>


    <div class="login-link">

        <p>
            Already have an account?
            <a href="login_page.html">
                Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
