<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Generate Bill</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {

            width: 450px;

            margin: 50px auto;

            background-color: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);

        }

        h2 {

            text-align: center;

            color: darkblue;

            margin-bottom: 25px;

        }

        label {

            display: block;

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 6px;

        }

        input {

            width: 100%;

            box-sizing: border-box;

            padding: 11px;

            margin-bottom: 18px;

            border: 1px solid #aaa;

            border-radius: 5px;

            font-size: 15px;

        }

        input:focus {

            border-color: darkblue;

            outline: none;

        }

        button {

            width: 100%;

            padding: 12px;

            background-color: green;

            color: white;

            border: none;

            border-radius: 5px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background-color: darkgreen;

        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Generate Bill</h2>

        <form>

            <label>Patient Name</label>

            <input type="text"
                   name="patientName"
                   placeholder="Enter Patient Name"
                   required>

            <label>Consultation Charges</label>

            <input type="number"
                   name="consultationCharges"
                   placeholder="Enter Consultation Charges"
                   required>

            <label>Medicine Charges</label>

            <input type="number"
                   name="medicineCharges"
                   placeholder="Enter Medicine Charges"
                   required>

            <label>Discount</label>

            <input type="number"
                   name="discount"
                   placeholder="Enter Discount"
                   required>

            <label>Total Amount</label>

            <input type="number"
                   name="totalAmount"
                   placeholder="Total Amount"
                   readonly>

            <button type="submit">
                Generate Bill
            </button>

        </form>

    </div>

</body>

</html>
