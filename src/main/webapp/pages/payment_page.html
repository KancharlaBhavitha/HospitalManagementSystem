<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Payment</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        .details {
            background: #f5f8ff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .details p {
            margin: 10px 0;
            font-size: 16px;
        }

        label {
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Hospital Payment</h2>


    <!-- Bill Details -->

    <div class="details">

        <p>
            <strong>Bill ID:</strong>
            <span id="billId"></span>
        </p>

        <p>
            <strong>Bill Amount:</strong>
            ₹<span id="billAmount"></span>
        </p>

    </div>


    <!-- Payment Form -->

    <form
        action="/PaymentServlet"
        method="post">


        <!-- Bill ID -->

        <input
            type="hidden"
            name="billId"
            id="billIdInput">


        <!-- Amount -->

        <input
            type="hidden"
            name="billAmount"
            id="billAmountInput">


        <!-- Payment Method -->

        <label>Payment Method</label>

        <select
            name="paymentMethod"
            required>

            <option value="">
                -- Select Payment Method --
            </option>

            <option value="Cash">
                Cash
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="Credit Card">
                Credit Card
            </option>

            <option value="Debit Card">
                Debit Card
            </option>

            <option value="Net Banking">
                Net Banking
            </option>

        </select>


        <!-- Pay Button -->

        <button type="submit">
            Pay Now
        </button>

    </form>

</div>


<script>

    // Get values from URL

    const params =
        new URLSearchParams(
            window.location.search
        );

    const billId =
        params.get("billId");

    const amount =
        params.get("amount");


    // Display Bill ID

    document.getElementById("billId")
        .textContent =
        billId || "";


    // Display Amount

    document.getElementById("billAmount")
        .textContent =
        amount || "";


    // Send values to PaymentServlet

    document.getElementById("billIdInput")
        .value =
        billId || "";


    document.getElementById("billAmountInput")
        .value =
        amount || "";

</script>

</body>

</html>
