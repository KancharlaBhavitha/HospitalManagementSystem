<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Invoice List</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            color: darkblue;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>My Invoice List</h2>

        <p>
            View all your hospital invoices.
        </p>

        <form
            action="/HospitalManagementSystem/InvoiceListServlet"
            method="get">

            <button type="submit">
                View All Invoices
            </button>

        </form>

    </div>

</body>

</html>
